name: Super Quina quality checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: super-quina-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superquina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d superquina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/superquina_test?schema=public
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and route tests
        run: npm test

      - name: Check lint
        run: npm run lint

      - name: Apply migrations to a clean PostgreSQL database
        run: npm run db:deploy

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
        env:
          RUN_POSTGRES_INTEGRATION: "1"

      - name: Build production application
        run: npm run build
